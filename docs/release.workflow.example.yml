# Copy to .github/workflows/release.yml in GitHub UI to enable automated tag signing
name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bash scripts/sign-release.sh
      - name: Publish signed release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pkg.tgz
            CHECKSUMS.txt
            CHECKSUMS.src.txt
          generate_release_notes: true
